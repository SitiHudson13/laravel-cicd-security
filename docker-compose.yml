services:
  app:
    build: .
    container_name: secureproject-app
    ports:
      - "8000:8000"
    volumes:
      # Editable source folders (inspect and, in later labs, fix the code from your host editor)
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
      - ./resources/views:/var/www/html/resources/views
      - ./database/migrations:/var/www/html/database/migrations
      - ./database/seeders:/var/www/html/database/seeders
      - ./tests:/var/www/html/tests
      - ./solutions:/var/www/html/solutions
    # Bound to localhost only: this application is intentionally vulnerable.
